events {}
http {
  # Provider A is primary; B only receives traffic when A fails (passive failover).
  upstream cloud {
    server provider_a:5001 max_fails=1 fail_timeout=2s;
    server provider_b:5002 backup;
  }
  server {
    listen 80;
    location /api/ { proxy_pass http://sentinel:8000; }
    location /work {
      proxy_pass http://cloud;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
      proxy_next_upstream error timeout http_502 http_503;
    }
    location / { root /usr/share/nginx/html; index index.html; }
  }
}
