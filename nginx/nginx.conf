events {}
http {
  # Docker's built-in DNS. Names used in proxy_pass variables are looked up at
  # request time and cached for 2 s, so recreated containers are found quickly.
  resolver 127.0.0.11 valid=2s ipv6=off;

  server {
    listen 80;

    location /api/ {
      set $sentinel http://sentinel:8000;
      proxy_pass $sentinel;
    }

    # Primary: provider A. If it errors, times out or is killed (503), retry on provider B.
    location /work {
      set $primary http://provider_a:5001;
      proxy_pass $primary;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
      proxy_intercept_errors on;
      error_page 502 503 504 = @backup;
    }

    location @backup {
      set $standby http://provider_b:5002;
      proxy_pass $standby;
      proxy_connect_timeout 1s;
      proxy_read_timeout 2s;
    }

    location / { root /usr/share/nginx/html; index index.html; }
  }
}